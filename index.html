<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三角洲行动 S12「微光」3×3 保险箱任务思维导图（含阶段星级门槛）</title>
<style>
  :root{
    --bg:#070b14; --bg2:#0b111d; --card:#101827; --card2:#0d1523;
    --line:rgba(255,255,255,.09); --txt:#e6ecf5; --txt2:#95a3b8; --txt3:#66748a;
    --s1:#4fc3f7; --s2:#ffb74d; --s3:#b388ff; --s4:#ff6b6b;
    --gold:#ffd166; --blue:#7fb2ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 600px at 15% -10%,rgba(79,195,247,.10),transparent 60%),
      radial-gradient(900px 500px at 95% 0%,rgba(255,107,107,.08),transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;padding:14px 22px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(16,24,39,.92),rgba(9,14,24,.6));
    backdrop-filter:blur(8px);z-index:20;
  }
  .brand{display:flex;flex-direction:column;gap:3px;min-width:300px}
  .brand .k{font-size:11px;letter-spacing:2.4px;color:var(--txt3);text-transform:uppercase}
  .brand h1{margin:0;font-size:20px;letter-spacing:.5px;font-weight:800}
  .brand h1 em{font-style:normal;color:var(--s1)}
  .brand .s{font-size:12px;color:var(--txt2)}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;color:var(--txt2);
  }
  .pill b{color:var(--txt);font-size:13px}
  .pill.gold{border-color:rgba(255,209,102,.35);background:rgba(255,209,102,.07)}
  .pill.gold b{color:var(--gold)}
  .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tabs button{
    border:0;background:transparent;color:var(--txt2);font-size:13px;padding:7px 16px;border-radius:8px;
    cursor:pointer;font-family:inherit;transition:.18s;
  }
  .tabs button.on{background:linear-gradient(180deg,rgba(79,195,247,.25),rgba(79,195,247,.12));color:#dff2ff;box-shadow:inset 0 0 0 1px rgba(79,195,247,.35)}
  .search{position:relative}
  .search input{
    width:230px;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:.2s;
  }
  .search input:focus{border-color:rgba(79,195,247,.5);box-shadow:0 0 0 3px rgba(79,195,247,.12)}
  .search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--txt3);font-size:15px}
  .search .hits{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--txt3)}

  /* ---------- main ---------- */
  #main{flex:1;display:flex;min-height:0;position:relative}
  #stage{
    flex:1;position:relative;overflow:hidden;min-width:0;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:26px 26px;cursor:grab;
  }
  #stage.dragging{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #nodes{position:absolute;left:0;top:0}

  .node{
    position:absolute;display:flex;align-items:center;gap:8px;
    border-radius:10px;border:1px solid var(--line);background:var(--card2);
    padding:0 12px;cursor:pointer;user-select:none;transition:box-shadow .18s,border-color .18s,opacity .2s;
    overflow:hidden;
  }
  .node:hover{border-color:rgba(255,255,255,.28);box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .node.dim{opacity:.18}
  .node.hit{box-shadow:0 0 0 2px rgba(255,209,102,.75),0 0 24px rgba(255,209,102,.4);border-color:transparent}

  .node-root{
    flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;
    background:linear-gradient(135deg,rgba(79,195,247,.18),rgba(179,136,255,.16),rgba(255,107,107,.14));
    border-color:rgba(120,190,255,.45);box-shadow:0 0 40px rgba(79,195,247,.22),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .node-root .rcode{font-size:10.5px;letter-spacing:1.6px;color:#9fd8ff}
  .node-root .rname{font-size:22px;font-weight:800;letter-spacing:.5px}
  .node-root .rsub{font-size:11px;color:var(--txt2)}

  .node-stage{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,#0d1523),#0d1523 70%)}
  .node-stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .node-stage .scode{font-size:10px;letter-spacing:1.4px;color:var(--c);opacity:.95}
  .node-stage .sname{font-size:17px;font-weight:800}
  .node-stage .scnt{font-size:10.5px;color:var(--txt3);white-space:nowrap}

  .node-chain{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.11)}
  .node-chain .cname{font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:0}
  .node-chain .cnt{font-size:10.5px;color:var(--txt3);background:rgba(255,255,255,.07);padding:1px 6px;border-radius:999px;margin-left:2px}
  .node-chain .stars{font-size:10.5px;font-weight:700;color:var(--gold);background:rgba(255,209,102,.13);border:1px solid rgba(255,209,102,.32);padding:0 6px;border-radius:999px;margin-left:auto;flex:0 0 auto}
  .node-chain .mtag{font-size:10px;color:#8fb7d8;background:rgba(127,178,255,.12);border:1px solid rgba(127,178,255,.3);padding:0 6px;border-radius:999px;margin-left:auto;flex:0 0 auto}
  .node-chain .plus{font-size:11px;color:var(--txt3);margin-left:4px}
  .node-stage .sneed{font-size:10px;color:var(--gold);opacity:.94;white-space:nowrap;letter-spacing:0}

  .node-task{background:rgba(255,255,255,.028);border-color:rgba(255,255,255,.075);padding:0 10px}
  .node-task .tid{font-family:Consolas,Menlo,monospace;font-size:11px;color:var(--c);opacity:.85;letter-spacing:.3px;flex:0 0 auto}
  .node-task .tname{font-size:13px;color:#dbe4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .node-task .warn{width:14px;height:14px;border-radius:50%;background:rgba(255,107,107,.18);color:#ff8f8f;font-size:9px;
    display:flex;align-items:center;justify-content:center;margin-left:auto;flex:0 0 auto}
  .node-task.sel{border-color:rgba(79,195,247,.75);box-shadow:0 0 0 1px rgba(79,195,247,.5),0 0 22px rgba(79,195,247,.28)}

  /* toolbar */
  #toolbar{
    position:absolute;left:16px;top:14px;z-index:15;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:6px;border-radius:12px;border:1px solid var(--line);
    background:rgba(11,17,29,.82);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  #toolbar button{
    border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--txt2);font-size:12px;
    padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;
  }
  #toolbar button:hover{background:rgba(255,255,255,.09);color:var(--txt)}
  #toolbar button.on{background:rgba(79,195,247,.16);color:#cfeeff;border-color:rgba(79,195,247,.4)}
  #toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
  #hint{
    position:absolute;left:16px;bottom:14px;z-index:15;font-size:11.5px;color:var(--txt3);
    background:rgba(11,17,29,.72);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  }
  #hint b{color:var(--txt2);font-weight:600}
  #zoombar{position:absolute;right:16px;bottom:14px;z-index:15;display:flex;gap:6px;align-items:center;
    background:rgba(11,17,29,.82);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11.5px;color:var(--txt2)}
  #zoombar button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--txt);cursor:pointer;font-size:13px;line-height:1}

  /* ---------- panel ---------- */
  #panel{
    position:absolute;right:0;top:0;bottom:0;width:372px;z-index:30;
    border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(13,20,33,.985),rgba(8,12,21,.99));
    overflow-y:auto;padding:20px 18px 40px;
    transform:translateX(103%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:-24px 0 60px rgba(0,0,0,.55);backdrop-filter:blur(10px);
  }
  #panel.open{transform:none}
  #pclose{
    position:absolute;right:384px;top:16px;z-index:31;width:30px;height:30px;border-radius:9px;
    border:1px solid var(--line);background:rgba(11,17,29,.9);color:var(--txt2);cursor:pointer;
    font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;
  }
  #pclose.on{display:flex}
  #panel::-webkit-scrollbar,.list-body::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb,.list-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .p-title{font-size:11px;letter-spacing:2px;color:var(--txt3);margin:0 0 10px}
  .p-card{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);padding:14px;margin-bottom:14px}
  .crumb{font-size:11px;color:var(--txt3);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .crumb i{font-style:normal;color:var(--c,var(--s1))}
  .tname-big{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:4px}
  .tid-big{font-family:Consolas,monospace;font-size:11.5px;color:var(--txt3);letter-spacing:.6px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(255,107,107,.12);color:#ff9c9c;border:1px solid rgba(255,107,107,.28)}
  .sec{font-size:11px;letter-spacing:1.6px;color:var(--txt3);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .obj{margin:0;padding:0;list-style:none}
  .obj li{position:relative;padding-left:16px;font-size:12.5px;line-height:1.75;color:#c8d3e2;margin-bottom:5px}
  .obj li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--c,var(--s1));opacity:.8}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#c3cede}
  .chip.hb{color:var(--gold);border-color:rgba(255,209,102,.3);background:rgba(255,209,102,.09)}
  .chip.exp{color:var(--blue);border-color:rgba(127,178,255,.28);background:rgba(127,178,255,.09)}
  .chip.card{color:#ff8f8f;border-color:rgba(255,107,107,.34);background:rgba(255,107,107,.12);font-weight:700}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:rgba(255,255,255,.025)}
  .kpi span{display:block;font-size:10.5px;color:var(--txt3);margin-bottom:3px}
  .kpi b{font-size:14px}
  .note{font-size:11.5px;line-height:1.7;color:var(--txt3)}
  .note b{color:var(--txt2)}
  .stagebar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);margin-top:10px}
  .stagebar i{display:block;height:100%}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--txt3);margin-top:8px}
  .legend s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .legend u{width:8px;height:8px;border-radius:2px;display:inline-block}

  /* ---------- list view ---------- */
  #listView{display:none;flex:1;min-height:0;overflow:hidden;flex-direction:column}
  #listView.on{display:flex}
  .list-toolbar{
    flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .list-toolbar .cbtn{
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt2);font-size:12px;
    padding:6px 13px;border-radius:999px;cursor:pointer;font-family:inherit;
  }
  .list-toolbar .cbtn.on{color:#08111f;font-weight:700;background:var(--c,#4fc3f7);border-color:transparent}
  .list-body{flex:1;overflow-y:auto;padding:18px 24px 60px}
  .list-body>*{max-width:1180px;margin:0 auto}
  .lstage{margin-bottom:26px}
  .lstage h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .lstage h2 i{width:4px;height:18px;border-radius:2px;background:var(--c);display:inline-block}
  .lstage .lsub{font-size:11.5px;color:var(--txt3);margin:0 0 14px 13px}
  .lchain{margin-bottom:16px}
  .lchain h3{font-size:13px;margin:0 0 8px;color:var(--txt2);font-weight:700;letter-spacing:.4px}
  .lchain h3 span{color:var(--txt3);font-weight:400;margin-left:6px;font-size:11px}
  .ltask{
    border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:11px 13px;
    background:rgba(255,255,255,.024);margin-bottom:8px;
  }
  .ltask .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .ltask .h .id{font-family:Consolas,monospace;font-size:11px;color:var(--c)}
  .ltask .h .nm{font-size:13.5px;font-weight:700}
  .ltask .h .b{font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(255,107,107,.12);color:#ff9c9c;border:1px solid rgba(255,107,107,.25)}
  .ltask .o{font-size:12px;color:#b9c5d6;line-height:1.7;padding-left:12px;position:relative}
  .ltask .o::before{content:"·";position:absolute;left:2px;color:var(--c)}
  .ltask .r{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  @media (max-width:1080px){
    #panel{display:none}
    .brand{min-width:auto}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="k">DELTA FORCE · SEASON 12 「微光」</div>
      <h1>3×3 保险箱任务 <em>思维导图</em></h1>
      <div class="s">行动计划 4 阶段 · 主线 / 支线全收录 · 任务编号 + 目标 + 奖励 · 阶段星级门槛</div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="right">
      <div class="search"><input id="q" placeholder="搜索任务名 / 编号 / 目标"><span class="hits" id="hits"></span></div>
      <div class="tabs">
        <button id="tabMap" class="on">思维导图</button>
        <button id="tabList">任务总览</button>
      </div>
    </div>
  </header>

  <div id="main">
    <div id="stage">
      <div id="canvas">
        <svg id="links"></svg>
        <div id="nodes"></div>
      </div>
      <div id="toolbar">
        <button id="btnOverview" class="on">结构总览</button>
        <div class="sep"></div>
        <button data-stage="0">阶段 1</button>
        <button data-stage="1">阶段 2</button>
        <button data-stage="2">阶段 3</button>
        <button data-stage="3">阶段 4</button>
        <div class="sep"></div>
        <button id="btnExpand">展开全部</button>
        <div class="sep"></div>
        <button id="btnInfo">奖励总览</button>
      </div>
      <div id="hint"><b>点击分支</b>展开任务 · <b>点击任务</b>看详情 · <b>拖拽</b>平移 · <b>滚轮</b>缩放</div>
      <div id="zoombar"><button id="zo">−</button><span id="zval">62%</span><button id="zi">＋</button><button id="zf">适应</button></div>
    </div>
    <aside id="panel"></aside>
    <button id="pclose" title="收起面板">✕</button>
  </div>

  <div id="listView">
    <div class="list-toolbar" id="listFilter"></div>
    <div class="list-body" id="listBody"></div>
  </div>
</div>

<script>
/* ============ 数据：来自 23 张任务截图逐条录入 ============ */
const S = (code, name, color, chains) => ({code, name, color, chains});
const C = (name, tasks) => ({name, tasks});
const t = (id, name, obj, rw, tags) => ({id, name, obj, rw, tags: tags || []});

const DATA = [
  S('第 1 阶段', '萤火初现', '#4fc3f7', [
    C('赛季主线', [
      t('82001', '恢复出勤', ['任意机密/绝密行动，成功撤离 1 次（单局收益需 ≥ 300,000 哈夫币）'], ['经验1,250', '哈夫币200,000', '顶级安全箱1天权限卡×1']),
      t('82002', '初显锋芒', ['任意机密/绝密行动，使用任意突击步枪/轻机枪/冲锋枪，击败 5 名任意敌方士兵'], ['经验1,500', '哈夫币200,000', '战地医疗箱×2']),
      t('82003', '物资整备', ['任意机密/绝密行动，累计成功带出 3 件品质 ≥ 紫色的能源燃料/资料情报/电子物品类收集品'], ['经验1,500', '哈夫币200,000', '赛季任务仿制钥匙补给包×2']),
      t('82004', '前线侦察', ['上交 2 件品质 ≥ 紫色的电子物品类收集品', '上交 2 件品质 ≥ 紫色的资料情报类收集品'], ['经验1,500', '哈夫币200,000', '赛季任务定制装备券×1']),
      t('82005', '失控脑机', ['零号大坝机密/永夜：大坝坝顶小屋内指定地点，获取任务物品', '大坝坝顶指挥所内指定地点，超感回溯作战终端处遗留语音线索'], ['经验1,550', '哈夫币200,000', '体能强化剂×5', '顶级安全箱1天权限卡×1']),
      t('82006', '黑心博士', ['AZ3 机密/超能：老科学院控制中心内指定地点，获取任务物品【患者医疗记录】', '同处超感回溯作战终端处遗留的语音线索', '携带任务物品成功撤离'], ['经验1,800', '哈夫币200,000', 'E型滤毒罐×2'], ['单局完成', '失败重置']),
      t('82007', '药师亚尼', ['巴克什：老城区樱桃小镇民房内指定地点，获取任务物品【药物采购单】', '同处超感回溯收音机处遗留的语音线索', '巴克什集市餐厅内指定地点，超感回溯阿萨尔的曲谱'], ['经验1,600', '哈夫币250,000', '赛季任务定制装备券×1'])
    ]),
    C('1-1 配给运用作战', [
      t('82901', '深度定制-1', ['任意机密/绝密行动，使用任意轻机枪，击败 5 名敌方士兵'], ['经验1,500', '哈夫币125,000', '高级燃料×2']),

const countRW = kw => ALL.reduce((a, x) => a + x.rw.filter(r => r.includes(kw)).length, 0);
const numRW = kw => ALL.reduce((a, x) => {

  return a + s;
}, 0);
const CARD1 = countRW('顶级安全箱1天');
const HBTOTAL = numRW('哈夫币');
const EXPTOTAL = numRW('经验');
const RULE = ALL.filter(x => x.tags.some(g => g.includes('限制'))).length;
const ONESHOT = ALL.filter(x => x.tags.includes('单局完成')).length;

const fmt = n => n.toLocaleString('en-US');

/* ============ 头部统计 ============ */
document.getElementById('stats').innerHTML = [
  `<div class="pill">任务总数 <b>${TOTAL}</b></div>`,
  `<div class="pill">阶段 <b>4</b> · 分支 <b>${DATA.reduce((a, s) => a + s.chains.length, 0)}</b></div>`,
  `<div class="pill">哈夫币合计 <b>${fmt(HBTOTAL)}</b></div>`,

].join('');

/* ============ 建树（左右双翼布局） ============ */
const X = [0, 326, 606, 900];
const W = {root: 340, stage: 274, chain: 262, task: 262};
const H = {root: 106, stage: 88, chain: 46, task: 36};

const root = {
  key: 'root', type: 'root', w: W.root, h: H.root, depth: 0, collapsed: false, dir: 0,
  label: '3×3 保险箱任务', children: []
};
DATA.forEach((s, si) => {
  const skey = 's' + si;
  const sn = {
    key: skey, type: 'stage', w: W.stage, h: H.stage, depth: 1, collapsed: true, dir: si < 2 ? 1 : -1,
    code: s.code, name: s.name, color: s.color, children: [], parent: root, si
  };
  s.chains.forEach((c, ci) => {
    const ckey = skey + '-c' + ci;
    const cn = {
      key: ckey, type: 'chain', w: W.chain, h: H.chain, depth: 2, collapsed: true, dir: sn.dir,
      name: c.name, color: s.color, children: [], parent: sn, count: c.tasks.length
    };
    c.tasks.forEach((task, ti) => {
      cn.children.push({
        key: ckey + '-t' + ti, type: 'task', w: W.task, h: H.task, depth: 3, collapsed: true, dir: sn.dir,
        data: task, color: s.color, children: [], parent: cn
      });
    });
    sn.children.push(cn);
  });
  root.children.push(sn);
});

function measure(n) {
  const kids = (!n.collapsed && n.children.length) ? n.children : [];
  if (!kids.length) return n.h + (n.type === 'task' ? 8 : 12);
  let s = 0;
  kids.forEach(k => s += measure(k));
  if (n.type === 'stage') s += 30;
  return s;
}
function measureList(l) { return l.reduce((a, n) => a + measure(n), 0); }

function walk(n, depth, y) {
  n.depth = depth;
  n.x = n.dir === 1 ? X[Math.min(depth, 3)] : -(X[Math.min(depth, 3)] + n.w);
  const kids = (!n.collapsed && n.children.length) ? n.children : [];
  n.vis = kids;
  if (!kids.length) {
    n.y = y + n.h / 2;
    return y + n.h + (n.type === 'task' ? 8 : 12);
  }
  let yy = y;
  kids.forEach(k => { yy = walk(k, depth + 1, yy); });
  n.y = (kids[0].y + kids[kids.length - 1].y) / 2;
  if (n.type === 'stage') yy += 30;
  return yy;
}
function shift(list, dy) {
  list.forEach(n => { n.y += dy; if (n.vis.length) shift(n.vis, dy); });
}

function layout() {
  const rightKids = root.children.filter(s => s.dir === 1);
  const leftKids = root.children.filter(s => s.dir === -1);
  const rh = measureList(rightKids), lh = measureList(leftKids);
  let y1 = 0, y2 = 0;
  rightKids.forEach(k => { y1 = walk(k, 1, y1); });
  leftKids.forEach(k => { y2 = walk(k, 1, y2); });
  const total = Math.max(y1, y2);
  shift(rightKids, (total - y1) / 2);
  shift(leftKids, (total - y2) / 2);
  root.vis = root.children;
  root.y = total / 2;
  root.x = -W.root / 2;
  root.mapH = total;
  root.mapW = 2 * (X[3] + W.task);
}

function visibleNodes() {
  const out = [];
  (function w2(n) { out.push(n); n.vis.forEach(w2); })(root);
  return out;
}

/* ============ 渲染 ============ */
const nodesEl = document.getElementById('nodes');
const svg = document.getElementById('links');
const canvas = document.getElementById('canvas');
const stageEl = document.getElementById('stage');

const state = { zoom: 0.62, panX: 40, panY: 40, sel: null, focus: null };

function nodeHTML(n) {
  if (n.type === 'root') {
    return `<span class="rcode">DELTA FORCE · SEASON 12「微光」</span>
      <span class="rname">3×3 保险箱任务</span>
      <span class="rsub">行动计划 4 阶段 · ${TOTAL} 任务 · 主线+支线星数逐阶解锁</span>`;
  }
  if (n.type === 'stage') {
    const cnt = n.children.reduce((a, c) => a + c.children.length, 0);
    const sStars = n.children.reduce((a, c) => a + (CHAIN_STAR[c.name] || 0), 0);
    const unlock = n.si >= 3
      ? '终章：仅 6 个主线，做完即毕业（无支线、不用星）'
      : NEED[n.si] === 0
        ? '解锁下一阶：主线全做即可（第 4 阶段免支线星）'
        : '解锁下一阶：主线全做 + 支线 ' + NEED[n.si] + '★';
    return `<span class="scode">${n.code}</span><span class="sname">${n.name}</span>
      <span class="scnt">${n.children.length} 分支 · ${cnt} 任务${sStars ? ' · 支线合计 ' + sStars + '★' : ''}</span>
      <span class="sneed">${unlock}</span>`;
  }
  if (n.type === 'chain') {
    const open = !n.collapsed;
    const st = CHAIN_STAR[n.name] || 0;
    const tag = st ? `<span class="stars">★${st}</span>` : `<span class="mtag">主线·必做</span>`;
    return `<span class="cname">${n.name}</span>${tag}<span class="cnt">${n.count}</span>
      <span class="plus">${open ? '−' : '+'}</span>`;
  }
  const d = n.data;
  const warn = d.tags.length ? `<span class="warn">!</span>` : '';
  return `<span class="tid">${d.id}</span><span class="tname">${d.name}</span>${warn}`;
}

function render() {
  layout();
  const all = visibleNodes();
  const list = all.filter(n => state.focus === null
    ? true
    : (n.type === 'task' || n.type === 'chain' || n.key === 's' + state.focus));
  let html = '';
  list.forEach(n => {
    const cls = 'node node-' + n.type + (n.type === 'task' && state.sel === n.key ? ' sel' : '');
    const style = `left:${n.x}px;top:${n.y - n.h / 2}px;width:${n.w}px;height:${n.h}px;--c:${n.color || '#4fc3f7'}`;
    html += `<div class="${cls}" style="${style}" data-key="${n.key}">${nodeHTML(n)}</div>`;
  });
  nodesEl.innerHTML = html;

  let paths = '';
  list.forEach(n => {
    n.vis.forEach(k => {
      let x1, y1, x2, y2;
      if (n.type === 'root') {
        x1 = k.dir === 1 ? n.x + n.w : n.x;
        x2 = k.dir === 1 ? k.x : k.x + k.w;
      } else if (n.dir === 1) {
        x1 = n.x + n.w; x2 = k.x;
      } else {
        x1 = n.x; x2 = k.x + k.w;
      }
      y1 = n.y; y2 = k.y;
      const dx = Math.max(24, Math.abs(x2 - x1) * 0.45);
      const c1 = x1 + (x2 > x1 ? dx : -dx);
      const c2 = x2 + (x2 > x1 ? -dx : dx);
      const col = k.color || n.color || '#4fc3f7';
      const op = n.type === 'root' ? .5 : .34;
      paths += `<path d="M${x1},${y1} C${c1},${y1} ${c2},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="${n.type === 'root' ? 2 : 1.5}"/>`;
    });
  });
  svg.setAttribute('width', root.mapW);
  svg.setAttribute('height', Math.max(root.mapH, 400));
  svg.innerHTML = paths;
  nodesEl.style.position = 'absolute';

  applyTransform();
  document.getElementById('zval').textContent = Math.round(state.zoom * 100) + '%';
}

function applyTransform() {
  canvas.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
}

function bboxOf(keys) {
  const list = visibleNodes().filter(n => !keys || keys.some(k => n.key === k || n.key.startsWith(k)));
  if (!list.length) return {x: 0, y: 0, w: 800, h: 600};
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  list.forEach(n => {
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y - n.h / 2);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h / 2);
  });
  return {x: x1, y: y1, w: x2 - x1, h: y2 - y1};
}

function fit(b, minZ, anchor) {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  let z = Math.min((vw - 150) / Math.max(b.w, 1), (vh - 150) / Math.max(b.h, 1), 1.05);
  z = Math.max(z, minZ || 0.28);
  state.zoom = z;
  const overW = b.w * z > vw - 150, overH = b.h * z > vh - 150;
  state.panX = overW ? 75 - b.x * z : 75 + (vw - 150 - b.w * z) / 2 - b.x * z;
  if (overH) state.panY = anchor ? vh * 0.5 - anchor.y * z : 92 - b.y * z;
  else state.panY = 85 + (vh - 150 - b.h * z) / 2 - b.y * z;
  applyTransform();
  document.getElementById('zval').textContent = Math.round(state.zoom * 100) + '%';
}

function centerOn(n) {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const occl = panel.classList.contains('open') ? 392 : 0;
  state.zoom = 0.75;
  state.panX = (vw - occl) * 0.36 - (n.x + n.w / 2) * state.zoom;
  state.panY = vh * 0.46 - n.y * state.zoom;
  applyTransform();
  document.getElementById('zval').textContent = Math.round(state.zoom * 100) + '%';
}

/* ============ 交互 ============ */
const byKey = {};
(function idx(n) { byKey[n.key] = n; n.children.forEach(idx); })(root);

function toggle(n) {
  if (n.type === 'root') return;
  const sx = n.x * state.zoom + state.panX, sy = n.y * state.zoom + state.panY;
  n.collapsed = !n.collapsed;
  render();
  const nx = n.x * state.zoom + state.panX, ny = n.y * state.zoom + state.panY;
  state.panX += sx - nx; state.panY += sy - ny;
  applyTransform();
}

nodesEl.addEventListener('click', e => {
  const el = e.target.closest('.node');
  if (!el) return;
  const n = byKey[el.dataset.key];
  if (!n) return;
  if (n.type === 'task') { state.sel = n.key; render(); showTask(n); centerOnSoft(n); }
  else toggle(n);
});

function centerOnSoft(n) {
  const vw = stageEl.clientWidth, vh = stageEl.clientHeight;
  const sx = n.x * state.zoom + state.panX, sy = n.y * state.zoom + state.panY;
  if (sx < 60 || sx > vw - 300 || sy < 90 || sy > vh - 60) {
    state.panX += vw * 0.34 - sx;
    state.panY += vh * 0.5 - sy;
    applyTransform();
  }
}

/* 拖拽 / 缩放 */
let drag = null;
stageEl.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.target.closest('#toolbar') || e.target.closest('#zoombar')) return;
  drag = {x: e.clientX, y: e.clientY, px: state.panX, py: state.panY};
  stageEl.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  state.panX = drag.px + (e.clientX - drag.x);
  state.panY = drag.py + (e.clientY - drag.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { drag = null; stageEl.classList.remove('dragging'); });

stageEl.addEventListener('wheel', e => {
  if (e.target.closest('#panel')) return;
  e.preventDefault();
  const r = stageEl.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const z0 = state.zoom;
  const z = Math.min(1.6, Math.max(0.18, z0 * (e.deltaY > 0 ? 0.9 : 1.1)));
  state.panX = mx - (mx - state.panX) * (z / z0);
  state.panY = my - (my - state.panY) * (z / z0);
  state.zoom = z;
  applyTransform();
  document.getElementById('zval').textContent = Math.round(z * 100) + '%';
}, {passive: false});

        <div><span>任务总数</span><b>${TOTAL}</b></div>
        <div><span>分支 / 阶段</span><b>${DATA.reduce((a, s) => a + s.chains.length, 0)} / 4</b></div>
        <div><span>哈夫币合计</span><b style="color:#ffd166">${fmt(HBTOTAL)}</b></div>
        <div><span>经验合计</span><b style="color:#7fb2ff">${fmt(EXPTOTAL)}</b></div>
        <div><span>顶级安全箱1天卡</span><b style="color:#ff8f8f">${CARD1} 张</b></div>
        <div><span>单局 / 限制任务</span><b>${ONESHOT} / ${RULE}</b></div>
      </div>
      <div class="sec">各阶段任务量</div>
      ${rows}
    </div>
    <div class="p-card">
      <div class="p-title">阶段解锁 · 星级门槛</div>
      <div class="note" style="margin-bottom:10px">规则：完成本阶段<b>全部主线</b> + 支线攒够<b>本阶段星数</b> → 解锁下一阶段（第 1/2/3 阶段分别需 <b>6 / 12 / 14★</b>）。每条支线需<b>完成其全部任务</b>才计入整颗星；<b>第 4 阶段只有主线、没有 ★</b>。</div>
      ${DATA.map((s, i) => {
        const chains = s.chains.filter(c => CHAIN_STAR[c.name]);
        const sum = chains.reduce((a, c) => a + CHAIN_STAR[c.name], 0);
        const line = chains.map(c => `${c.name.replace(/（.*）/, '')}<i style="color:#ffd166;font-style:normal;font-weight:700">★${CHAIN_STAR[c.name]}</i>`).join(' · ');
        return `<div style="margin-bottom:11px">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px">
            <u style="width:8px;height:8px;border-radius:2px;background:${s.color};display:inline-block;flex:0 0 auto"></u>
            <span style="color:#c8d3e2">${s.code} · ${s.name}</span>
            <span style="color:#ffd166;font-weight:700;margin-left:auto;flex:0 0 auto">${i >= 3 ? '终章' : NEED[i] === 0 ? '免星' : '需 ' + NEED[i] + '★'}</span></div>
          <div style="font-size:11px;color:#8a97ab;line-height:1.9;padding-left:16px">${line || '— 无支线，主线毕业 —'}<br>
          <span style="color:#66748a">${i >= 3 ? '' : NEED[i] === 0 ? '支线合计 ' + sum + '★（仅作奖励，不影响解锁）' : '支线合计 ' + sum + '★' + (sum > NEED[i] ? '（富余 ' + (sum - NEED[i]) + '★，可少做）' : '')}</span></div>
        </div>`;
      }).join('')}
      <div class="note" style="margin-top:4px">省事拿星参考：阶段1 配给运用作战3+再难告别3（6★ 刚好）；阶段2 披坚执锐5+寻味阿萨拉4+常胜冠军3（12★ 刚好）；阶段3 博物馆幽灵5+区域猎手4+过河卒4+逃脱艺术4（17★，富余 3★）。</div>
    </div>
    <div class="p-card">
      <div class="p-title">关键奖励</div>
      <div class="chips">
        <span class="chip card">顶级安全箱1天权限卡 ×${CARD1}</span>
        <span class="chip card">顶级安全箱7天权限卡 ×1</span>
        <span class="chip card">绝密服务器 ×1（82028）</span>
        <span class="chip">哈夫克机密档案 ×${countRW('哈夫克机密档案')}</span>
        <span class="chip">机械工蜂模型 ×${countRW('机械工蜂模型') * 2}</span>
        <span class="chip">赛季任务定制装备券 ×${countRW('赛季任务定制装备券')}</span>
      </div>
      <div class="note" style="margin-top:10px">完成全部 4 阶段主线 + 支线星级后，领取赛季 3×3（9 格）顶级安全箱权限。</div>
    </div>
    <div class="p-card">
      <div class="p-title">3×3 解锁三件套（图外补充）</div>
      <div class="note">
        <b>① 行动计划</b>：4 个阶段全部主线通关，并用支线补足阶段星级（6 / 12 / 14 星，第 4 阶段只有主线）。<br>
        <b>② 收集者委托</b>：每日刷新的上交委托，累计完成 2 轮。<br>
        <b>③ 命运契约</b>：高难挑战中任选 2 项完成（7 选 2）。<br>
        三者同步达标后，仓库领取「顶级安全箱」赛季权限卡，使用后本赛季 3×3 生效。
      </div>
      <div class="note" style="margin-top:8px;color:#66748a">※ 星数取自攻略图阶段标题（第一阶段 ♦7 ★6、第二阶段 ♦8 ★12、第三阶段 ♦8 ★14、第四阶段无 ★）与各支线标题（如 3-3 博物馆幽灵 ★5、3-6 逃脱艺术 ★4）。3-1 / 3-2（金枪客、狙击精英 = 5★）标题页未提供，仍为推算；以游戏内任务面板为准。</div>
    </div>`;
  openPanel();
}

/* ============ 任务总览列表 ============ */
let listStage = -1;
function renderList() {
  const body = document.getElementById('listBody');
  body.innerHTML = DATA.map((s, si) => {
    if (listStage >= 0 && listStage !== si) return '';
    const cnt = s.chains.reduce((a, c) => a + c.tasks.length, 0);
    return `<section class="lstage" style="--c:${s.color}">
      <h2><i></i>${s.code} · ${s.name}</h2>
      <div class="lsub">${s.chains.length} 个分支 / ${cnt} 个任务 · ${si >= 3 ? '终章：只有主线，做完即毕业（不用星）' : NEED[si] === 0 ? '解锁下一阶段：主线全做即可（第 4 阶段免星）' : '解锁下一阶段：主线全做 + 支线 ' + NEED[si] + '★'}</div>
      ${s.chains.map(c => `
        <div class="lchain">
          <h3>${c.name}<span>${CHAIN_STAR[c.name] ? '★' + CHAIN_STAR[c.name] + ' · ' + c.tasks.length + ' 任务全完成得 ' + CHAIN_STAR[c.name] + '★'  : '主线 · 必做 · ' + c.tasks.length + ' 任务'}</span></h3>
          ${c.tasks.map(d => `
            <div class="ltask" style="--c:${s.color}">
              <div class="h"><span class="id">${d.id}</span><span class="nm">${d.name}</span>
                ${d.tags.map(g => `<span class="b">${g}</span>`).join('')}</div>
              ${d.obj.map(o => `<div class="o">${o}</div>`).join('')}
              <div class="r">${d.rw.map(r => `<span class="chip ${chipCls(r)}">${r}</span>`).join('')}</div>
            </div>`).join('')}
        </div>`).join('')}
    </section>`;
  }).join('');
}

document.getElementById('listFilter').innerHTML =
  `<button class="cbtn on" data-ls="-1" style="--c:#8fd6ff">全部</button>` +
  DATA.map((s, i) => `<button class="cbtn" data-ls="${i}" style="--c:${s.color}">${s.code} · ${s.name}</button>`).join('');

document.querySelectorAll('#listFilter .cbtn').forEach(b => {
  b.onclick = () => {
    listStage = +b.dataset.ls;
    document.querySelectorAll('#listFilter .cbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    renderList();
    document.getElementById('listBody').scrollTop = 0;
  };
});

/* ============ Tab 切换 ============ */
const tabMap = document.getElementById('tabMap'), tabList = document.getElementById('tabList');
const listView = document.getElementById('listView');
tabMap.onclick = () => {
  tabMap.classList.add('on'); tabList.classList.remove('on');
  listView.classList.remove('on');
  document.getElementById('main').style.display = 'flex';
  render();
};
tabList.onclick = () => {
  tabList.classList.add('on'); tabMap.classList.remove('on');
  document.getElementById('main').style.display = 'none';
  closePanel();
  listView.classList.add('on');
  renderList();
};

/* ============ 启动 ============ */
render();
showOverview();
closePanel();
requestAnimationFrame(() => {
  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hp.has('task')) {
    const id = hp.get('task');
    const hit = ALL.find(x => x.id === id);
    if (hit) {
      DATA.forEach((_, k) => {
        const s = byKey['s' + k];
        s.collapsed = k !== hit._s;
        s.children.forEach(c => c.collapsed = k !== hit._s);
      });
      byKey['s' + hit._s].children[hit._c].collapsed = false;
      const n = byKey['s' + hit._s + '-c' + hit._c + '-t' + hit._t];
      state.sel = n.key;
      render();
      showTask(n);
      centerOn(n);
    } else {
      overview();
    }
  } else if (hp.has('all')) {
    expandAll();
  } else if (hp.has('info')) {
    overview();
    showOverview();
  } else if (hp.has('list')) {
    document.getElementById('tabList').click();
  } else if (hp.has('stage')) {
    focusStage(Math.max(0, Math.min(3, +hp.get('stage') || 0)));
  } else {
    overview();
  }
});
window.addEventListener('resize', () => { render(); });
</script>
</body>
</html>
